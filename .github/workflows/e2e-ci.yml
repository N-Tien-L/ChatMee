name: Full-stack E2E

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', '.github/workflows/e2e-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', '.github/workflows/e2e-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Make Maven wrapper executable
        run: chmod +x ../backend/mvnw
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated production-build E2E and intentional failure diagnostics check
        run: npm run test:e2e
      - name: Retain sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            frontend/e2e-diagnostics/startup.json
            frontend/e2e-diagnostics/suite.json
            frontend/e2e-diagnostics/failure-check.json
