name: chatmee
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    profiles:
      - full
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_MONGODB_URI=mongodb://mongo:27017/chatmee
      - SPRING_DATA_REDIS_HOST=redis
      - PORT=8080
    ports:
      - "8080:8080"

volumes:
  mongo-data:
