# Synthetic loopback fixture only. src/test/resources is excluded from bootJar.
server.address=127.0.0.1
server.port=8100
server.servlet.session.timeout=60s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.client.url=http://127.0.0.1:3100
spring.security.oauth2.client.registration.github.client-id=e2e-client
spring.security.oauth2.client.registration.github.client-secret=e2e-synthetic-secret
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://127.0.0.1:3100/login/oauth2/code/github
spring.security.oauth2.client.provider.github.authorization-uri=http://127.0.0.1:9100/authorize
spring.security.oauth2.client.provider.github.token-uri=http://127.0.0.1:9100/token
spring.security.oauth2.client.provider.github.user-info-uri=http://127.0.0.1:9100/userinfo
spring.security.oauth2.client.provider.github.user-name-attribute=id
logging.level.root=WARN