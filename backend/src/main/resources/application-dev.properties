# Load local secrets from backend/.env.dev (optional; real environment variables still take precedence)
spring.config.import=optional:file:.env.dev[.properties]

spring.mongodb.uri=${MONGO_URI_DEV}
server.port=${PORT:8080}

# Client URL
app.client.url=http://localhost:3000

# Logging Configuration
logging.level.com.lnt.chatmee.service.CustomOAuth2UserService=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# OAuth2 Configuration for Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Google Provider Configuration - Force account selection
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# OAuth2 Configuration for GitHub (optional)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

# OpenAPI docs at /v3/api-docs and Swagger UI at /swagger-ui.html (login required)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
