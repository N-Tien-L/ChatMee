spring.data.mongodb.uri=mongodb://localhost:27017/chatmee
spring.data.mongodb.auto-index-creation=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.client.url=http://localhost:3000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:replace-me}
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

spring.config.import=optional:file:.env[.properties]
