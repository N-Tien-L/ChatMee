spring.application.name=chatmee
spring.profiles.active=dev

# Plain-text logs show the correlation keys set by RequestIdFilter, UserMdcFilter and StompMdcInterceptor
logging.pattern.level=%5p [requestId=%X{requestId:-} userId=%X{userId:-}]

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
# Boot 4 turns the liveness/readiness health groups on by default; keep the Boot 3 surface (no extra health paths)
management.endpoint.health.probes.enabled=false

# OpenAPI docs and Swagger UI are off unless a profile enables them (dev, local)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**

# Create the indexes declared on documents (e.g. the unique participants (chatRoomId, userId) index) at startup
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
